name: Unpack m9q snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bootstrap snapshot
        run: |
          set -euo pipefail
          if [ -f index.html ] && [ -f assets.js ]; then echo "already unpacked"; exit 0; fi
          test -f bootstrap/MANIFEST.json
          n=$(python3 -c "import json;print(len(json.load(open('bootstrap/MANIFEST.json'))['parts']))")
          have=$(ls bootstrap/part-*.b64 | wc -l)
          if [ "$have" -lt "$n" ]; then echo "only $have of $n parts so far"; exit 0; fi
          python3 << 'PY'
          import json, base64, hashlib, pathlib, sys, zipfile
          man = json.loads(pathlib.Path("bootstrap/MANIFEST.json").read_text())
          data = base64.b64decode("".join((pathlib.Path("bootstrap") / p).read_text() for p in man["parts"]))
          d = hashlib.sha256(data).hexdigest()
          if d != man["sha256"]: sys.exit(f"sha256 mismatch {d}")
          pathlib.Path("/tmp/site.zip").write_bytes(data); zipfile.ZipFile("/tmp/site.zip").extractall(".")
          print("ok", len(data))
          PY
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Unpack m9q playtest build and remove bootstrap chunks [skip ci]" && git push
